version: '3.9'

services:

  # ─── PostgreSQL Database ───────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: stem_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stemuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stempassword}
      POSTGRES_DB: ${POSTGRES_DB:-stemdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stemuser} -d ${POSTGRES_DB:-stemdb}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stem_network

  # ─── FastAPI Backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend-stem
      dockerfile: Dockerfile
    container_name: stem_backend
    restart: unless-stopped
    env_file:
      - ./backend-stem/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-stemuser}:${POSTGRES_PASSWORD:-stempassword}@db:5432/${POSTGRES_DB:-stemdb}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - uploads_data:/app/uploads
      - ./backend-stem:/app
    command: >
      sh -c "alembic upgrade head && python seed_db.py && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - stem_network

  # ─── React + Nginx Frontend ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend-stem
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: stem_frontend
    restart: unless-stopped
    expose:
      - "80"          # <- убрали ports, оставили только expose
    depends_on:
      - backend
    networks:
      - stem_network

  # ─── Nginx Proxy Manager ───────────────────────────────────────────────────
  nginx-proxy:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"       # HTTP
      - "443:443"     # HTTPS
      - "81:81"       # Веб-интерфейс управления
    volumes:
      - ./nginx-proxy/data:/data
      - ./nginx-proxy/letsencrypt:/etc/letsencrypt
    depends_on:
      - frontend
    networks:
      - stem_network

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  stem_network:
    driver: bridge
